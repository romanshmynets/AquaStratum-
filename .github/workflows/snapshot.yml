name: Auto Snapshot on Push (main)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "state/**"
      - "sbom/**"
      - "snapshots/**"
      - ".github/workflows/introspect.yml"
      - "db_inventory/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Mark repo as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Set up git identity
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"

      - name: Make snapshot
        run: |
          chmod +x scripts/make_snapshot.sh || true
          if [ -x scripts/make_snapshot.sh ]; then ./scripts/make_snapshot.sh; fi

      - name: Commit snapshot file
        run: |
          git add snapshots/
          git commit -m "chore(snapshot): add snapshot for $GITHUB_SHA [skip ci]" || true
          git stash push -u -m "temp-snapshot" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git stash pop || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_number }}
          path: snapshots/*.md
