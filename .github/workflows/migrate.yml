name: Apply Supabase Schema (CLI)

on:
  push:
    branches: [ "main" ]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project (non-interactive)
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --no-open

      - name: Push migrations (and seed if present)
        run: |
          if [ -f "supabase/seed.sql" ]; then
            supabase db push --linked -p "$SUPABASE_DB_PASSWORD" --include-seed
          else
            supabase db push --linked -p "$SUPABASE_DB_PASSWORD"
          fi

      - name: Show migration status (optional)
        run: |
          supabase db pull --linked -p "$SUPABASE_DB_PASSWORD" --dry-run || true
