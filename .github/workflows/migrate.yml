name: Apply Supabase Schema

on:
  push:
    branches: [ "main" ]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID:  ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL:         ${{ secrets.DATABASE_URL }} # опційно, тільки для seed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project (non-interactive)
        run: |
          set -e
          supabase login "$SUPABASE_ACCESS_TOKEN"
          # ВАЖЛИВО: без --no-open (цей прапор застарів)
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations (and seed if present)
        run: |
          set -e
          # застосувати всі міграції до віддаленого проєкту
          supabase db push -p "$SUPABASE_DB_PASSWORD"

          # якщо є seed і є DATABASE_URL — виконуємо
          if [ -n "${DATABASE_URL:-}" ] && [ -f "supabase/seed.sql" ]; then
            echo "Running seed via psql…"
            sudo apt-get update && sudo apt-get install -y postgresql-client
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          else
            echo "Seed skipped (no DATABASE_URL or no supabase/seed.sql)"
          fi
