name: Apply Supabase Schema

on:
  push:
    branches: [ "main" ]
    paths:
      - "schema.sql"
      - "seed.sql"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Якщо додаси цей секрет — спробуємо pooler як запасний канал (порт 6543)
      DATABASE_URL_POOLER: ${{ secrets.DATABASE_URL_POOLER }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGCONNECT_TIMEOUT: "15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client & dns tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      - name: Verify DATABASE_URL
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL missing" && exit 1)

      - name: Build IPv4-forced DB URL
        id: v4
        shell: bash
        run: |
          # Витягнути hostname з URI (після '@' і до ':' або '/')
          HOST="$(echo "$DATABASE_URL" | sed -E 's|^[^@]+@([^:/?]+).*|\1|')"
          echo "Host: $HOST"

          # Отримати першу A-запис (IPv4)
          IPV4="$(getent ahostsv4 "$HOST" | awk '{print $1; exit}')"
          if [ -z "$IPV4" ]; then
            echo "Не вдалося визначити IPv4 для $HOST"
            exit 1
          fi
          echo "IPv4: $IPV4"

          # Додати параметр hostaddr=IPv4 (URI libpq підтримує це)
          SEP="$(echo "$DATABASE_URL" | grep -q '?' && echo '&' || echo '?')"
          DB_URL_V4="${DATABASE_URL}${SEP}hostaddr=${IPV4}&sslmode=require"
          echo "DB_URL_V4=$DB_URL_V4" >> "$GITHUB_ENV"

      - name: Run schema (idempotent) via IPv4
        shell: bash
        run: |
          psql "$DB_URL_V4" -v ON_ERROR_STOP=1 -f schema.sql

      - name: Run seed (optional) via IPv4
        if: hashFiles('seed.sql') != ''
        shell: bash
        run: |
          psql "$DB_URL_V4" -v ON_ERROR_STOP=1 -f seed.sql

      # --- Fallback: якщо раптом IPv4 кроки впадуть, спробувати через Pooler ---
      - name: Fallback schema via Pooler (optional)
        if: failure() && env.DATABASE_URL_POOLER != ''
        shell: bash
        run: |
          echo "Trying pooler URL..."
          psql "$DATABASE_URL_POOLER" -v ON_ERROR_STOP=1 -f schema.sql

      - name: Fallback seed via Pooler (optional)
        if: failure() && env.DATABASE_URL_POOLER != '' && hashFiles('seed.sql') != ''
        shell: bash
        run: |
          psql "$DATABASE_URL_POOLER" -v ON_ERROR_STOP=1 -f seed.sql
