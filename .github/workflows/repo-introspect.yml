name: Repo Introspection

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # daily @ 04:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-introspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code_inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repo as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install tools (jq, cloc, syft)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq cloc curl
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin v1.16.0

      - name: Prepare OUT dir
        id: prep
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%dT%H%M%SZ)"; echo "TS=$TS" >> "$GITHUB_ENV"
          SHA="$(git rev-parse --short HEAD)"; echo "SHA=$SHA" >> "$GITHUB_ENV"
          OUT="state/${TS}_${SHA}/code"; echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT" public/api/code

      - name: Build file allowlist/denylist
        run: |
          cat > .github/codeignore <<'EOF'
          .git/
          node_modules/
          dist/
          build/
          .next/
          .vercel/
          coverage/
          .turbo/
          .cache/
          .DS_Store
          state/
          snapshots/
          sbom/
          db_inventory/
          public/api/db/
          public/api/db_data/
          public/api/code/
          EOF

      - name: Generate file tree (human-readable)
        run: |
          set -euo pipefail
          EXCLUDES="$(sed 's/[].[^$\\*]/\\&/g' .github/codeignore | paste -sd '|' -)"
          echo "Repository tree (filtered):" > "$OUT/tree.txt"
          printf "\nExcludes:\n" >> "$OUT/tree.txt"
          cat .github/codeignore >> "$OUT/tree.txt"
          printf "\n===========================\n\n" >> "$OUT/tree.txt"
          if [ -n "$EXCLUDES" ]; then
            find . -type f | grep -Ev "^./($EXCLUDES)" | sed 's|^\./||' | sort >> "$OUT/tree.txt"
          else
            find . -type f | sed 's|^\./||' | sort >> "$OUT/tree.txt"
          fi

      - name: Build JSON inventory (size, sha256, ext, path)
        run: |
          set -euo pipefail
          EXCLUDES="$(sed 's/[].[^$\\*]/\\&/g' .github/codeignore | paste -sd '|' -)"
          TMP="$(mktemp)"
          if [ -n "$EXCLUDES" ]; then
            find . -type f | grep -Ev "^./($EXCLUDES)" | sed 's|^\./||' | sort > "$TMP"
          else
            find . -type f | sed 's|^\./||' | sort > "$TMP"
          fi
          {
            echo "["
            first=1
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              sz=$(stat -c%s "$f" || echo 0)
              sha=$(sha256sum "$f" | awk '{print $1}')
              ext="${f##*.}"; [ "$ext" = "$f" ] && ext=""
              obj=$(jq -n --arg path "$f" --arg ext "$ext" --arg sha "$sha" --argjson size "$sz" \
                      '{path:$path, ext:$ext, size:$size, sha256:$sha}')
              if [ $first -eq 1 ]; then
                echo "  $obj"; first=0
              else
                echo "  ,$obj"
              fi
            done < "$TMP"
            echo "]"
          } > "$OUT/inventory.json"

      - name: Language/LOC report (cloc)
        run: |
          set -euo pipefail
          EXCL_DIRS=$(awk -F/ '/\/$/ {print $1}' .github/codeignore | paste -sd, -)
          if [ -n "$EXCL_DIRS" ]; then
            cloc --json --quiet --exclude-dir="$EXCL_DIRS" . > "$OUT/cloc.json" || echo '{}' > "$OUT/cloc.json"
          else
            cloc --json --quiet . > "$OUT/cloc.json" || echo '{}' > "$OUT/cloc.json"
          fi

      - name: SBOM (syft dir:.)
        run: |
          set -euo pipefail
          syft dir:. -o json > "$OUT/sbom.json" || echo '{}' > "$OUT/sbom.json"

      - name: Build summary.json (counts)
        run: |
          set -euo pipefail
          files=$(jq 'length' "$OUT/inventory.json")
          bytes=$(jq '[.[].size] | add // 0' "$OUT/inventory.json")
          langs=$(jq 'del(.header) | length' "$OUT/cloc.json" 2>/dev/null || echo 0)
          jq -n \
            --arg ts  "$TS" \
            --arg sha "$SHA" \
            --argjson files "$files" \
            --argjson bytes "$bytes" \
            --argjson lang_count "$langs" \
            --argjson top10 "$(jq 'sort_by(-.size) | .[0:10]' "$OUT/inventory.json")" \
            '{ts:$ts, sha:$sha, files:$files, bytes:$bytes, lang_count:$lang_count, top10:$top10}' \
            > "$OUT/summary.json"

      - name: Publish snapshot and latest
        run: |
          set -euo pipefail
          SNAP_DIR="public/api/code/${TS}_${SHA}"
          LATEST_DIR="public/api/code/latest"
          mkdir -p "$SNAP_DIR" "$LATEST_DIR"
          cp -r "$OUT/"* "$SNAP_DIR/"

          # оновлюємо latest (стерти і скопіювати заново)
          rm -rf "$LATEST_DIR"
          mkdir -p "$LATEST_DIR"
          cp -r "$OUT/"* "$LATEST_DIR/"

          # оновлюємо index.json: додаємо/оновлюємо запис і latest-вказівник
          INDEX="public/api/code/index.json"
          if [ -f "$INDEX" ]; then
            jq --arg ts "$TS" --arg sha "$SHA" --arg path "$SNAP_DIR" \
               '.[0] as $i
                | .snapshots = ( (.snapshots // []) + [{ts:$ts, sha:$sha, path:$path}] )
                | .snapshots |= (unique_by(.ts) | sort_by(.ts) | reverse)
                | .latest = {ts:$ts, sha:$sha, path:$path}' \
               "$INDEX" 2>/dev/null \
               || jq -n --arg ts "$TS" --arg sha "$SHA" --arg path "$SNAP_DIR" \
                    '{latest:{ts:$ts,sha:$sha,path:$path},snapshots:[{ts:$ts,sha:$sha,path:$path}]}' \
               > "$INDEX.tmp" && mv "$INDEX.tmp" "$INDEX"
          else
            jq -n --arg ts "$TS" --arg sha "$SHA" --arg path "$SNAP_DIR" \
              '{latest:{ts:$ts,sha:$sha,path:$path},snapshots:[{ts:$ts,sha:$sha,path:$path}]}' > "$INDEX"
          fi

      - name: Commit & Push
        run: |
          set -euo pipefail
          git config user.name  "repo-introspect-bot"
          git config user.email "repo-introspect-bot@users.noreply.github.com"
          git add state/ public/api/code/
          git commit -m "chore(repo-introspect): code snapshot ${TS}_${SHA} [skip ci]" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
