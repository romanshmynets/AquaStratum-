name: Project Introspection

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "snapshots/**"
      - "state/**"
      - "sbom/**"
      - "db_inventory/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: introspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  introspect:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN:     ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID:       ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD:      ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_BATCH: "5000"
      DATA_MAX_ROWS: "200000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Mark repo as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Git identity
        run: |
          git config user.name  "introspect-bot"
          git config user.email "introspect-bot@users.noreply.github.com"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq graphviz curl
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin v1.16.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Dump DB schema via Supabase CLI
        id: dump
        run: |
          set -e
          TS="$(date -u +%Y%m%dT%H%M%SZ)"; echo "TS=${TS}"  >> "$GITHUB_ENV"
          SHA="$(git rev-parse --short HEAD)"; echo "SHA=${SHA}" >> "$GITHUB_ENV"
          OUT="state/${TS}_${SHA}/db"; mkdir -p "${OUT}"; echo "OUT_DIR=${OUT}" >> "$GITHUB_ENV"
          supabase login "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" -f "${OUT}/schema.sql"

      - name: "RPC - fetch tables/columns/pks/fks/indexes/views"
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          INV="${OUT_DIR}/rpc"; mkdir -p "$INV"

          # ВАЖЛИВО: Content-Profile/Accept-Profile = introspect (схема функцій)
          H1="-H apikey: ${KEY}"
          H2="-H Authorization: Bearer ${KEY}"
          H3="-H Accept: application/json"
          H4="-H Content-Type: application/json"
          H5="-H Content-Profile: introspect"
          H6="-H Accept-Profile: introspect"

          curl -sSf "${URL}/rest/v1/rpc/tables"  $H1 $H2 $H3 $H4 $H5 $H6 -d '{}' > "${INV}/tables.json"
          curl -sSf "${URL}/rest/v1/rpc/columns" $H1 $H2 $H3 $H4 $H5 $H6 -d '{}' > "${INV}/columns.json"
          curl -sSf "${URL}/rest/v1/rpc/pks"     $H1 $H2 $H3 $H4 $H5 $H6 -d '{}' > "${INV}/pks.json"
          curl -sSf "${URL}/rest/v1/rpc/fks"     $H1 $H2 $H3 $H4 $H5 $H6 -d '{}' > "${INV}/fks.json"
          curl -sSf "${URL}/rest/v1/rpc/indexes" $H1 $H2 $H3 $H4 $H5 $H6 -d '{}' > "${INV}/indexes.json"
          curl -sSf "${URL}/rest/v1/rpc/views"   $H1 $H2 $H3 $H4 $H5 $H6 -d '{}' > "${INV}/views.json"

          # Перевірка, що повернувся масив таблиць
          jq -e 'type=="array"' "${INV}/tables.json" > /dev/null

          # summary з підрахунком і повним списком
          jq '{table_count: length, tables: [ .[] | (.schema_name + "." + .table_name) ]}' \
             "${INV}/tables.json" > "${INV}/summary.json"

      - name: Export table data via REST (service_role)
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          DATA_DIR="${OUT_DIR}/db_data"; mkdir -p "${DATA_DIR}"
          BATCH=${DATA_BATCH:-5000}; MAX=${DATA_MAX_ROWS:-200000}

          jq -r '.[] | "\(.schema_name) \(.table_name)"' "${OUT_DIR}/rpc/tables.json" \
            | while read SCHEMA NAME; do
                SAFE_SCHEMA="$(echo "$SCHEMA" | tr -cd '[:alnum:]_')"
                SAFE_TABLE="$(echo "$NAME"   | tr -cd '[:alnum:]_')"
                DEST_DIR="${DATA_DIR}/${SAFE_SCHEMA}"; mkdir -p "${DEST_DIR}"
                DEST="${DEST_DIR}/${SAFE_TABLE}.jsonl"; : > "${DEST}"

                off=0
                while [ $off -lt $MAX ]; do
                  RESP="$(curl -sS "${URL}/rest/v1/${SAFE_TABLE}?select=*&limit=${BATCH}&offset=${off}" \
                               -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
                               -H "Accept-Profile: ${SCHEMA}")"
                  cnt="$(echo "$RESP" | jq 'length')"
                  [ "$cnt" = "0" ] && break
                  echo "$RESP" | jq -c '.[]' >> "${DEST}"
                  off=$((off + BATCH))
                  [ "$cnt" -lt "$BATCH" ] && break
                done
              done

      - name: ERD (from FK)
        run: |
          DOT="${OUT_DIR}/erd.dot"; PNG="${OUT_DIR}/erd.png"
          {
            echo "digraph ERD {"
            echo "  graph [rankdir=LR, bgcolor=white];"
            echo "  node [shape=box, style=rounded, fontname=Arial];"
            echo "  edge [color=gray50, arrowsize=0.7];"
            jq -r '.[] | "\(.src_schema).\(.src_table)\n\(.tgt_schema).\(.tgt_table)"' "${OUT_DIR}/rpc/fks.json" | sort -u | \
              while read n; do [ -n "$n" ] && echo "  \"$n\";"; done
            jq -r '.[] | "\"\(.src_schema).\(.src_table)\" -> \"\(.tgt_schema).\(.tgt_table)\" [label=\"\(.src_columns) → \(.tgt_columns)\", fontsize=9];"' \
              "${OUT_DIR}/rpc/fks.json"
            echo "}"
          } > "$DOT"
          dot -Tpng "$DOT" -o "$PNG" || true

      - name: Publish inventory to repo root & Pages
        run: |
          mkdir -p db_inventory public/api/db public/api/db_data
          cp "${OUT_DIR}/rpc/"*.json db_inventory/ || true
          cp -r "${OUT_DIR}/db_data/" public/api/db_data/ || true
          cp db_inventory/*.json public/api/db/ || true
          cp "${OUT_DIR}/erd.png" public/ || true

      - name: Commit & Push
        run: |
          git add state/ db_inventory/ public/
          git commit -m "chore(introspect): rpc inventory + data for $GITHUB_SHA [skip ci]" || true
          git stash push -u -m "temp-introspect" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git stash pop || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: public }

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
