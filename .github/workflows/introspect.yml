name: Introspect (Code + DB, fail-fast)

on:
  push:
    branches: [ main ]
    paths-ignore: [ "public/**" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # ← додай ці secrets у GitHub: Settings → Secrets and variables → Actions
  INTROSPECT_BASE: ${{ secrets.INTROSPECT_BASE }}   # e.g. https://<project_ref>.supabase.co/rest/v1/rpc
  INTROSPECT_KEY:  ${{ secrets.INTROSPECT_KEY }}    # anon or service key

jobs:
  introspect_all:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl cloc tree zip file coreutils

      - name: Prepare dirs
        run: |
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "TS=$TS" >> $GITHUB_ENV
          mkdir -p state/${TS}/code public/api/code/latest public/api/code/snapshots
          mkdir -p public/api/db/latest  public/api/db/snapshots
          mkdir -p public/api/meta/latest public/api/meta/snapshots

      # -------------------
      # CODE INTROSPECT
      # -------------------
      - name: Code: inventory / cloc / tree / sbom
        run: |
          set -euo pipefail
          OUT="state/${TS}/code"
          # tree
          (tree -a -F -I ".git|node_modules|.turbo|dist|build|.next" > "${OUT}/tree.txt") || true
          # inventory (sha256)
          find . -type f -not -path "./.git/*" -print0 \
            | xargs -0 -I{} bash -lc '
                p="{}"; s=$(stat -c%s "{}" 2>/dev/null || echo 0);
                h=$(sha256sum "{}" | awk "{print \$1}");
                printf "{\"path\":\"%s\",\"bytes\":%s,\"sha256\":\"%s\"}\n" "${p#./}" "$s" "$h"
              ' \
            | jq -s '.' > "${OUT}/inventory.json"
          # cloc
          cloc --json --quiet --exclude-dir=.git,node_modules,.next,dist,build . > "${OUT}/cloc.json" || echo '{}' > "${OUT}/cloc.json"
          # sbom (плейсхолдер)
          jq -n --arg ts "$TS" --argjson files "$(jq 'length' "${OUT}/inventory.json")" \
             '{timestamp:$ts, components:{repo_files:$files}, notes:"replace with Syft/CycloneDX if needed"}' \
             > "${OUT}/sbom.json"
          # summary
          FILES=$(jq 'length' "${OUT}/inventory.json")
          BYTES=$(jq '[ .[].bytes ] | add' "${OUT}/inventory.json")
          jq -n --arg ts "$TS" --argjson files "$FILES" --argjson bytes "$BYTES" \
             '{ts:$ts, files:$files, bytes:$bytes}' > "${OUT}/summary.json"

      - name: Code: publish snapshot + latest
        run: |
          rsync -a "state/${TS}/code/" "public/api/code/snapshots/${TS}/"
          rm -rf "public/api/code/latest" && mkdir -p "public/api/code/latest"
          rsync -a "public/api/code/snapshots/${TS}/" "public/api/code/latest/"

      # -------------------
      # DB INTROSPECT (Supabase RPC)
      # -------------------
      - name: DB: fetch tables/columns/pks/fks/indexes/views/summary (fail-fast)
        env:
          BASE: ${{ env.INTROSPECT_BASE }}
          KEY:  ${{ env.INTROSPECT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${BASE:-}" ] || { echo "INTROSPECT_BASE secret missing"; exit 1; }
          [ -n "${KEY:-}"  ] || { echo "INTROSPECT_KEY secret missing";  exit 1; }

          hdr=(-H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}")

          fetch() {
            name="$1"
            url="${BASE}/${name}"
            out="public/api/db/latest/${name}.json"
            echo "GET ${url}"
            code=$(curl -sS -w "%{http_code}" "${hdr[@]}" "$url" -o "_${name}.json" || echo 000)
            # validate JSON
            cat "_${name}.json" | jq . >/dev/null 2>&1 || { echo "JSON parse failed for ${name}"; code=000; }
            # non-200 → fail
            if [ "$code" != "200" ]; then
              echo "{\"error\":true,\"http\":$code,\"note\":\"${name} failed\"}" > "$out"
              echo "HTTP $code on ${name}"; exit 1
            fi
            # Supabase RPC error object → fail
            if jq 'has("code") and (.code|type=="string")' "_${name}.json" | grep -q true; then
              jq '.' "_${name}.json" > "$out"
              echo "RPC error for ${name}"; exit 1
            fi
            mv "_${name}.json" "$out"
            echo "OK ${name}"
          }

          fetch tables
          fetch columns
          fetch pks
          fetch fks
          fetch indexes
          fetch views
          fetch summary

          # не приймаємо «порожню» БД
          if [ "$(jq 'length' public/api/db/latest/tables.json)" -eq 0 ]; then
            echo "No tables returned by RPC. Failing to avoid empty master."; exit 1
          fi

      - name: DB: snapshot version
        if: ${{ success() }}
        run: |
          TS="${TS:?}"
          mkdir -p "public/api/db/snapshots/${TS}"
          cp public/api/db/latest/*.json "public/api/db/snapshots/${TS}/"

      # -------------------
      # META (опційно, якщо ти додаси свої RPC)
      # -------------------
      - name: META: placeholder
        run: |
          # якщо мета ще не збирається — створимо порожні-але-валідні файли
          echo "[]"  > public/api/meta/latest/rls_policies.json
          echo "{}"  > public/api/meta/latest/dictionary.json
          TS="${TS:?}"
          mkdir -p "public/api/meta/snapshots/${TS}"
          cp public/api/meta/latest/* "public/api/meta/snapshots/${TS}/"

      # -------------------
      # BUILD MASTER (в тому самому воркфлоу)
      # -------------------
      - name: Build master_snapshot.json
        run: |
          set -euo pipefail
          mkdir -p public/api/master/latest
          TS="${TS:?}"
          SHA=$(git rev-parse --short=12 HEAD || echo "no-git")

          obj(){ [ -f "$1" ] && jq -c 'if type=="object" then . else {} end' "$1" || echo "{}"; }
          arr(){ [ -f "$1" ] && jq -c 'if type=="array"  then . else [] end' "$1" || echo "[]"; }
          txt(){ [ -f "$1" ] && jq -Rs '.' < "$1" || echo "\"\""; }

          CODE_DIR="public/api/code/latest"
          DB_DIR="public/api/db/latest"
          META_DIR="public/api/meta/latest"

          DB_TABLES=$(arr "$DB_DIR/tables.json")
          # якщо пусто — фейл, щоб не було «порожнього master»
          if [ "$(jq 'length' <<<"$DB_TABLES")" -eq 0 ]; then
            echo "No DB tables. Master not built."; exit 1
          fi

          jq -n \
            --arg ts "$TS" \
            --arg sha "$SHA" \
            --argjson code_summary "$(obj "$CODE_DIR/summary.json")" \
            --argjson code_inventory "$(arr "$CODE_DIR/inventory.json")" \
            --argjson code_cloc     "$(obj "$CODE_DIR/cloc.json")" \
            --argjson code_sbom     "$(obj "$CODE_DIR/sbom.json")" \
            --arg code_tree         "$(txt "$CODE_DIR/tree.txt")" \
            --argjson db_tables     "$DB_TABLES" \
            --argjson db_columns    "$(arr "$DB_DIR/columns.json")" \
            --argjson db_pks        "$(arr "$DB_DIR/pks
