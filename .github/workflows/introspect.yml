name: Project Introspection

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'snapshots/**'
      - 'state/**'
      - 'sbom/**'
  schedule:
    - cron: '10 16 * * *'   # 03:10 Australia/Melbourne (UTC 16:10)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: introspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  introspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repo as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Git identity
        run: |
          git config user.name "introspect-bot"
          git config user.email "introspect-bot@users.noreply.github.com"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tree ripgrep universal-ctags jq graphviz
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin v1.16.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Collect project state (fs/deps/env/docker/index)
        run: |
          chmod +x scripts/collect_state.sh
          ./scripts/collect_state.sh

      - name: Dump DB schema via Supabase CLI
        id: dump
        shell: bash
        run: |
          set -e
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SHA="$(git rev-parse --short HEAD)"
          OUT="state/${TS}_${SHA}/db"
          mkdir -p "${OUT}"
          echo "OUT_DIR=${OUT}" >> "$GITHUB_ENV"
          echo "TS=${TS}" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"

          supabase login "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" --schema-only -f "${OUT}/schema.sql"

      - name: Inventory DB objects and ERD
        shell: bash
        run: |
          chmod +x scripts/inventory_db.sh scripts/erd_from_schema.sh
          scripts/inventory_db.sh "${OUT_DIR}/schema.sql" "${OUT_DIR}"
          scripts/erd_from_schema.sh "${OUT_DIR}/FK.json" "${OUT_DIR}"

      - name: Generate SBOM (syft)
        run: |
          mkdir -p sbom
          syft scan dir:. -o json > sbom/packages.json || true
          syft scan dir:. -o spdx-json > sbom/spdx.json || true

      - name: Make snapshot
        run: |
          chmod +x scripts/make_snapshot.sh
          ./scripts/make_snapshot.sh

      - name: Build summary (state diff and db overview)
        shell: bash
        run: |
          set -e
          echo "## Repository State @ ${TS} (${SHA})" >> $GITHUB_STEP_SUMMARY

          # top-level dirs in new state
          echo "### State contents" >> $GITHUB_STEP_SUMMARY
          find "state/${TS}_${SHA}" -maxdepth 2 -type d | sed 's|^|- |' | head -n 200 >> $GITHUB_STEP_SUMMARY || true

          # DB overview
          echo -e "\n### Database (from dump)" >> $GITHUB_STEP_SUMMARY
          TCOUNT=$(grep -cE "^[[:space:]]*CREATE[[:space:]]+TABLE[[:space:]]" "${OUT_DIR}/schema.sql" || true)
          VCOUNT=$(grep -cE "^[[:space:]]*CREATE[[:space:]]+(OR[[:space:]]+REPLACE[[:space:]]+)?VIEW" "${OUT_DIR}/schema.sql" || true)
          FCOUNT=$(grep -cE "^[[:space:]]*CREATE[[:space:]]+(OR[[:space:]]+REPLACE[[:space:]]+)?FUNCTION" "${OUT_DIR}/schema.sql" || true)
          ICOUNT=$(grep -cE "^[[:space:]]*CREATE[[:space:]]+INDEX" "${OUT_DIR}/schema.sql" || true)
          echo "- tables: ${TCOUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- views: ${VCOUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- functions: ${FCOUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- indexes: ${ICOUNT}" >> $GITHUB_STEP_SUMMARY

          # first 30 tables
          echo -e "\n#### First tables" >> $GITHUB_STEP_SUM
