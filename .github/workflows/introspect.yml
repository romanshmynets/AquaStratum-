name: Project Introspection

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'snapshots/**'
      - 'state/**'
      - 'sbom/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: introspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  introspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repo as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Git identity
        run: |
          git config user.name "introspect-bot"
          git config user.email "introspect-bot@users.noreply.github.com"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tree ripgrep universal-ctags jq graphviz
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin v1.16.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "${SUPABASE_PROJECT_ID:-}"   || (echo "Missing SUPABASE_PROJECT_ID" && exit 1)
          test -n "${SUPABASE_DB_PASSWORD:-}"  || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)

      - name: Collect project state (fs/deps/env/docker/index)
        run: |
          chmod +x scripts/collect_state.sh
          ./scripts/collect_state.sh

      - name: Dump DB schema via Supabase CLI
        id: dump
        shell: bash
        run: |
          set -e
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SHA="$(git rev-parse --short HEAD)"
          OUT="state/${TS}_${SHA}/db"
          mkdir -p "${OUT}"
          echo "OUT_DIR=${OUT}" >> "$GITHUB_ENV"
          echo "TS=${TS}" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"

          supabase login "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

          # ВАЖЛИВО: без --schema-only. Ця команда у поточній версії CLI дає дамп схеми (без даних).
          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" -f "${OUT}/schema.sql"

      - name: Inventory DB objects and ERD
        shell: bash
        run: |
          chmod +x scripts/inventory_db.sh scripts/erd_from_schema.sh || true
          if [ -f "scripts/inventory_db.sh" ]; then
            scripts/inventory_db.sh "${OUT_DIR}/schema.sql" "${OUT_DIR}" || true
          fi
          if [ -f "scripts/erd_from_schema.sh" ]; then
            scripts/erd_from_schema.sh "${OUT_DIR}/FK.json" "${OUT_DIR}" || true
          fi

          # Short summary
          echo "## Database snapshot" >> $GITHUB_STEP_SUMMARY
          if [ -f "${OUT_DIR}/TABLES.md" ]; then
            head -n 200 "${OUT_DIR}/TABLES.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "_Inventory not generated (optional script not present)_" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate SBOM (syft)
        run: |
          mkdir -p sbom
          syft scan dir:. -o json > sbom/packages.json || true
          syft scan dir:. -o spdx-json > sbom/spdx.json || true

      - name: Make snapshot
        run: |
          chmod +x scripts/make_snapshot.sh
          ./scripts/make_snapshot.sh

      - name: Commit state, SBOM & snapshot
        run: |
          git add state/ sbom/ snapshots/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(introspect): state+SBOM+snapshot for $GITHUB_SHA [skip ci]" || true
          git stash push -u -m "temp-introspect" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git stash pop || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-introspection-${{ github.run_number }}
          path: |
            state/**
            sbom/**
            snapshots/*.md
