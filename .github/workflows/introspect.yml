name: Project Introspection

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'snapshots/**'
      - 'state/**'
      - 'sbom/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: introspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  introspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repo as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Git identity
        run: |
          git config user.name "introspect-bot"
          git config user.email "introspect-bot@users.noreply.github.com"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tree ripgrep universal-ctags postgresql-client jq
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin v1.16.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID:-}" || { echo "Missing SUPABASE_PROJECT_ID"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

          # Очистити пробіли/лапки
          CLEAN_REF="$(echo -n "$SUPABASE_PROJECT_ID" | tr -d '\"'\''[:space:]')"
          if [ "$CLEAN_REF" != "$SUPABASE_PROJECT_ID" ]; then
            echo "Note: trimmed project ref from '${SUPABASE_PROJECT_ID}' to '${CLEAN_REF}'"
          fi

          # Перевірка формату: лише малі літери/цифри, довжина 20..32 (CLI різних версій показує 20–24+)
          if ! echo -n "$CLEAN_REF" | grep -Eq '^[a-z0-9]{20,32}$'; then
            echo "Invalid SUPABASE_PROJECT_ID format. Please paste the exact 'Project reference' from Supabase (letters+digits, lowercase). Got: '$CLEAN_REF'"
            exit 1
          fi
          echo "SUPABASE_PROJECT_ID looks valid."

          echo "SUPABASE_PROJECT_ID_CLEAN=$CLEAN_REF" >> "$GITHUB_ENV"

      - name: Collect project state
        run: |
          chmod +x scripts/collect_state.sh
          ./scripts/collect_state.sh

      - name: Dump DB schema via Supabase CLI
        shell: bash
        run: |
          set -e
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SHA="$(git rev-parse --short HEAD)"
          OUT="state/${TS}_${SHA}/db"
          mkdir -p "${OUT}"

          # Авторизація і лінкування
          supabase login "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_ID_CLEAN"

          # Дамп лише схеми (без даних)
          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" --schema-only -f "${OUT}/schema.sql" || true

      - name: Generate SBOM (syft)
        run: |
          mkdir -p sbom
          syft scan dir:. -o json > sbom/packages.json || true
          syft scan dir:. -o spdx-json > sbom/spdx.json || true

      - name: Make snapshot
        run: |
          chmod +x scripts/make_snapshot.sh
          ./scripts/make_snapshot.sh

      - name: Commit state, SBOM & snapshot
        run: |
          git add state/ sbom/ snapshots/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(introspect): state+SBOM+snapshot for $GITHUB_SHA [skip ci]"
          git stash push -u -m "temp-introspect" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git stash pop || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-introspection-${{ github.run_number }}
          path: |
            state/**
            sbom/**
            snapshots/*.md
