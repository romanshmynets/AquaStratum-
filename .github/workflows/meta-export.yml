name: Meta Export (REST RPC)

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/meta-export.yml"
      - "sql/**"
  workflow_dispatch:

jobs:
  meta_export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dirs
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="state/${TS}/rpc"
          mkdir -p "$OUT"
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Fetch RPC JSON (tables/columns/pks/fks/indexes/views)
        shell: bash
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          hdr() {
            echo "-H apikey: $KEY -H Authorization: Bearer $KEY -H Accept-Profile: introspect -H Content-Type: application/json"
          }

          curl -fsS "$URL/rest/v1/rpc/tables"  $(hdr) -d '{}' > "$OUT/tables.json"
          curl -fsS "$URL/rest/v1/rpc/columns" $(hdr) -d '{}' > "$OUT/columns.json"
          curl -fsS "$URL/rest/v1/rpc/pks"     $(hdr) -d '{}' > "$OUT/pks.json"
          curl -fsS "$URL/rest/v1/rpc/fks"     $(hdr) -d '{}' > "$OUT/fks.json"
          curl -fsS "$URL/rest/v1/rpc/indexes" $(hdr) -d '{}' > "$OUT/indexes.json"
          curl -fsS "$URL/rest/v1/rpc/views"   $(hdr) -d '{}' > "$OUT/views.json"

      - name: Export RLS policies (READ-ONLY via REST)
        shell: bash
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl -fsS "$URL/rest/v1/pg_policy?select=oid,polname,polrelid,polcmd,polpermissive,polroles,polqual,polwithcheck" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Accept-Profile: postgres" \
            -H "Content-Type: application/json" > "$OUT/rls_policies.json"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build summary
        run: |
          set -euo pipefail
          OUT="${OUT:?}"
          TABS=$(jq 'length' "$OUT/tables.json")
          COLS=$(jq 'length' "$OUT/columns.json")
          PKS=$(jq 'length' "$OUT/pks.json")
          FKS=$(jq 'length' "$OUT/fks.json")
          INDX=$(jq 'length' "$OUT/indexes.json")
          VIEWS=$(jq 'length' "$OUT/views.json")
          RLS=$(jq 'length' "$OUT/rls_policies.json")

          jq -r '.[0:30] | map("\(.table_schema).\(.table_name)") | @tsv' "$OUT/tables.json" \
            | sed 's/^/- /' > "$OUT/tables_top30.md"

          mkdir -p "state/${TS}"
          cat > "state/${TS}/summary.md" <<EOF
# AquaStratum – Inventory Snapshot (${TS})

## Counters
- Tables: ${TABS}
- Columns: ${COLS}
- PKs: ${PKS}
- FKs: ${FKS}
- Indexes: ${INDX}
- Views: ${VIEWS}
- RLS policies: ${RLS}

## Sample tables (first 30)
$(cat "$OUT/tables_top30.md")
EOF

      - name: Commit & Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "meta-export-bot"
          git config user.email "meta-export-bot@users.noreply.github.com"
          git add state/${TS}
          git commit -m "meta-export snapshot ${TS} via REST RPC [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:main
