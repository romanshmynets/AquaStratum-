name: Meta Export (RLS Policies & Data Dictionary)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  meta_export:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq postgresql-client

      - name: Prepare output dirs
        run: mkdir -p public/api/db

      - name: Check connection
        shell: bash
        run: |
          set -e
          echo "🔗 Testing connection..."
          psql "$DATABASE_URL" -c "select now();" || (echo "❌ Cannot connect to database" && exit 1)

      - name: Export RLS Policies
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "🟢 Exporting RLS policies..."
          if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "
            with p as (
              select n.nspname as schema_name,
                     c.relname as table_name,
                     pol.polname as policy_name,
                     pol.polcmd as command,
                     pol.polroles::text as roles,
                     pg_get_expr(pol.polqual, pol.polrelid) as using_expr,
                     pg_get_expr(pol.polwithcheck, pol.polrelid) as check_expr
              from pg_policy pol
              join pg_class c on c.oid = pol.polrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname not in ('pg_catalog','information_schema')
            )
            select coalesce(jsonb_pretty(jsonb_agg(
              jsonb_build_object(
                'schema', schema_name,
                'table',  table_name,
                'policy', policy_name,
                'command', command,
                'roles', roles,
                'using', using_expr,
                'check', check_expr
              )
            )), '[]') from p;
          " > public/api/db/policies.json; then
            echo "⚠️ Warning: failed to export RLS policies"
            echo "[]" > public/api/db/policies.json
          fi

      - name: Export Data Dictionary
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "🟢 Exporting Data Dictionary..."
          if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "
            with cols as (
              select table_schema, table_name, column_name, data_type, is_nullable, column_default
              from information_schema.columns
              where table_schema not in ('pg_catalog','information_schema')
            )
            select coalesce(jsonb_pretty(jsonb_agg(
              jsonb_build_object(
                'schema', table_schema,
                'table', table_name,
                'column', column_name,
                'type', data_type,
                'nullable', is_nullable,
                'default', column_default
              )
            )), '[]') from cols;
          " > public/api/db/datadict.json; then
            echo "⚠️ Warning: failed to export Data Dictionary"
            echo "[]" > public/api/db/datadict.json
          fi

      - name: Render Markdown summary
        shell: bash
        run: |
          echo "# Data Dictionary" > public/api/db/datadict.md
          jq -r '
            .[] | "## " + .schema + "." + .table + "\n" +
            "- **Column:** " + .column + "\n" +
            "- **Type:** " + .type + "\n" +
            "- **Nullable:** " + .nullable + "\n" +
            "- **Default:** " + (.default // "") + "\n"
          ' public/api/db/datadict.json >> public/api/db/datadict.md || echo "_Empty_"

      - name: Commit & Push results
        run: |
          git config user.name "meta-export-bot"
          git config user.email "meta-export-bot@users.noreply.github.com"
          git add public/api/db/policies.json public/api/db/datadict.json public/api/db/datadict.md
          git commit -m "chore: update meta export [skip ci]" || echo "No changes to commit"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}" || true
