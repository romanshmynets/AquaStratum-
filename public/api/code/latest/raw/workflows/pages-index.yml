name: Build Pages Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pages_index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat > public/index.json <<'EOF'
          {
            "code": {
              "latest": "public/api/code/latest/",
              "summary": "public/api/code/latest/summary.json",
              "inventory": "public/api/code/latest/inventory.json",
              "cloc": "public/api/code/latest/cloc.json",
              "sbom": "public/api/code/latest/sbom.json",
              "tree": "public/api/code/latest/tree.txt",
              "raw_dir": "public/api/code/latest/raw/",
              "source_zip": "public/api/code/latest/source.zip"
            },
            "db": {
              "latest": "public/api/db/latest/",
              "tables": "public/api/db/latest/tables.json",
              "columns": "public/api/db/latest/columns.json",
              "pks": "public/api/db/latest/pks.json",
              "fks": "public/api/db/latest/fks.json",
              "indexes": "public/api/db/latest/indexes.json",
              "views": "public/api/db/latest/views.json"
            },
            "meta": {
              "latest": "public/api/meta/latest/",
              "rls": "public/api/meta/latest/rls_policies.json",
              "dictionary": "public/api/meta/latest/dictionary.json"
            },
            "master": {
              "index": "public/api/master/index.json",
              "latest_json": "public/api/master/latest/master_snapshot.json",
              "latest_zip":  "public/api/master/latest/master_snapshot.zip"
            }
          }
          EOF

      - name: Commit & Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "pages-index-bot"
          git config user.email "pages-index-bot@users.noreply.github.com"
          git add public/index.json
          git commit -m "pages: index.json [skip ci]" || echo "Nothing to commit"
          git fetch origin main
          git rebase origin/main || true
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: public }

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
