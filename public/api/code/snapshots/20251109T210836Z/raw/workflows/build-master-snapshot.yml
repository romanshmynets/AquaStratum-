name: Build Master Snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "public/api/**"
      - ".github/workflows/build-master-snapshot.yml"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  OUT: public/api/master
  LATEST_DIR: public/api
  GHP_BRANCH: gh-pages
  TZ: "UTC"

jobs:
  build_master_snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools (jq, zip)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq zip

      - name: Resolve meta
        id: r
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          SHA=$(git rev-parse --short=12 HEAD)
          echo "ts=$TS"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          mkdir -p state

      - name: Build master_snapshot.json
        shell: bash
        run: |
          set -euo pipefail
          CODE="public/api/code/latest"
          DB="public/api/db/latest"
          META="public/api/meta/latest"
          OUT="${OUT}"

          safe_obj(){ [ -f "$1" ] && jq -c 'if type=="object" then . else {} end' "$1" || echo "{}"; }
          safe_arr(){ [ -f "$1" ] && jq -c 'if type=="array" then . else [.] end' "$1" || echo "[]"; }
          safe_txt(){ [ -f "$1" ] && jq -Rn --slurpfile t "$1" '$t[0]' || echo "\"\""; }

          CODE_SUMMARY=$(safe_obj "$CODE/summary.json")
          CODE_INVENTORY=$(safe_arr "$CODE/inventory.json")
          CODE_CLOC=$(safe_obj "$CODE/cloc.json")
          CODE_SBOM=$(safe_obj "$CODE/sbom.json")
          CODE_TREE=$(safe_txt "$CODE/tree.txt")

          DB_TABLES=$(safe_arr "$DB/tables.json")
          DB_COLUMNS=$(safe_arr "$DB/columns.json")
          DB_PKS=$(safe_arr "$DB/pks.json")
          DB_FKS=$(safe_arr "$DB/fks.json")
          DB_INDEXES=$(safe_arr "$DB/indexes.json")
          DB_VIEWS=$(safe_arr "$DB/views.json")

          META_RLS=$(safe_arr "$META/rls_policies.json")
          META_DICT=$(safe_obj "$META/dictionary.json")

          jq -n \
            --arg ts "${{ steps.r.outputs.ts }}" \
            --arg sha "${{ steps.r.outputs.sha }}" \
            --arg code_path "$CODE" \
            --arg db_path "$DB" \
            --arg meta_path "$META" \
            --argjson code_summary "$CODE_SUMMARY" \
            --argjson code_inventory "$CODE_INVENTORY" \
            --argjson code_cloc "$CODE_CLOC" \
            --argjson code_sbom "$CODE_SBOM" \
            --arg code_tree "$CODE_TREE" \
            --argjson db_tables "$DB_TABLES" \
            --argjson db_columns "$DB_COLUMNS" \
            --argjson db_pks "$DB_PKS" \
            --argjson db_fks "$DB_FKS" \
            --argjson db_indexes "$DB_INDEXES" \
            --argjson db_views "$DB_VIEWS" \
            --argjson meta_rls "$META_RLS" \
            --argjson meta_dict "$META_DICT" \
            '{
              snapshot:{ts:$ts, sha:$sha},
              sources:{ code:$code_path, db:$db_path, meta:$meta_path },
              code:{ summary:$code_summary, inventory:$code_inventory, cloc:$code_cloc, sbom:$code_sbom, tree_text:$code_tree },
              db:{ tables:$db_tables, columns:$db_columns, pks:$db_pks, fks:$db_fks, indexes:$db_indexes, views:$db_views },
              meta:{ rls_policies:$meta_rls, data_dictionary:$meta_dict }
            }' > "${OUT}/master_snapshot.json"

      - name: Build master_snapshot.zip
        shell: bash
        run: |
          set -euo pipefail
          SNAP_DIR="state/${{ steps.r.outputs.ts }}_${{ steps.r.outputs.sha }}/master"
          mkdir -p "$SNAP_DIR"
          cp -a "$OUT/master_snapshot.json" "$SNAP_DIR/"
          (cd "$SNAP_DIR" && zip -r ../master_snapshot.zip . >/dev/null)
          mv "state/${{ steps.r.outputs.ts }}_${{ steps.r.outputs.sha }}/master_snapshot.zip" "$OUT/master_snapshot.zip"

      - name: Update latest alias + index
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$LATEST_DIR/master/latest"
          mkdir -p "$LATEST"
          cp -a "$OUT/master_snapshot.json" "$LATEST/"
          cp -a "$OUT/master_snapshot.zip"  "$LATEST/"

          # simple index
          cat > "$LATEST/index.json" <<EOF
          {
            "ts": "${{ steps.r.outputs.ts }}",
            "sha": "${{ steps.r.outputs.sha }}",
            "files": ["master_snapshot.json","master_snapshot.zip"]
          }
          EOF

      - name: Commit & Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "master-snapshot-bot"
          git config user.email "master-snapshot-bot@users.noreply.github.com"

          git fetch origin main
          git merge --strategy-option ours origin/main || true

          git add public/api/master || true
          git add public/api/*/latest/index.json || true
          git add public/api/*/latest/master_snapshot.* || true

          git commit -m "master: snapshot ${{ steps.r.outputs.ts }} ${{ steps.r.outputs.sha }} [skip ci]" || echo "Nothing to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "push skipped (concurrent update)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
