name: DB Introspect (REST RPC)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  db_introspect:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ secrets.INTROSPECT_PROFILE || 'introspect' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq & curl
        run: sudo apt-get update -y && sudo apt-get install -y jq curl

      - name: Fetch RPC JSON & publish
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT_STATE="state/${TS}/db"
          OUT_PUB="public/api/db"
          mkdir -p "${OUT_STATE}" "${OUT_PUB}/latest" "${OUT_PUB}/snapshots/${TS}"

          hdr=(
            -H "apikey: ${KEY}"
            -H "Authorization: Bearer ${KEY}"
            -H "Accept-Profile: ${PROFILE}"
            -H "Content-Type: application/json"
          )

          fetch() {
            local ep="$1" file="$2"
            if curl -fsS "${hdr[@]}" "${URL}/rest/v1/rpc/${ep}" -d '{}' -o "${OUT_STATE}/${file}.raw"; then
              if jq -e 'type=="array"' "${OUT_STATE}/${file}.raw" >/dev/null; then
                mv "${OUT_STATE}/${file}.raw" "${OUT_STATE}/${file}.json"
              else
                jq -c 'if type=="object" then [.] else . end' "${OUT_STATE}/${file}.raw" > "${OUT_STATE}/${file}.json"
                rm -f "${OUT_STATE}/${file}.raw"
              fi
            else
              echo "[]" > "${OUT_STATE}/${file}.json"
            fi
          }

          # core set
          fetch tables   tables
          fetch columns  columns
          fetch pks      pks
          fetch fks      fks
          fetch indexes  indexes
          fetch views    views

          # quick summary
          jq -n \
            --slurpfile t "${OUT_STATE}/tables.json" \
            --slurpfile c "${OUT_STATE}/columns.json" \
            --slurpfile p "${OUT_STATE}/pks.json" \
            --slurpfile f "${OUT_STATE}/fks.json" \
            --slurpfile i "${OUT_STATE}/indexes.json" \
            --slurpfile v "${OUT_STATE}/views.json" \
            '{tables:($t[0]|length),columns:($c[0]|length),pks:($p[0]|length),fks:($f[0]|length),indexes:($i[0]|length),views:($v[0]|length)}' \
            > "${OUT_STATE}/summary.json"

          # publish snapshot + latest
          rsync -a "${OUT_STATE}/" "${OUT_PUB}/snapshots/${TS}/"
          rm -rf "${OUT_PUB}/latest" && mkdir -p "${OUT_PUB}/latest"
          rsync -a "${OUT_PUB}/snapshots/${TS}/" "${OUT_PUB}/latest/"

      - name: Commit & Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "db-introspect-bot"
          git config user.email "db-introspect-bot@users.noreply.github.com"
          git add public/api/db state/*/db
          git commit -m "db-introspect: db snapshot [skip ci]" || echo "Nothing to commit"
          git fetch origin main
          git rebase origin/main || true
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: public }

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
