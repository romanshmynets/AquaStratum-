name: Meta Export (RLS + Data Dictionary)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  meta_export:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ secrets.INTROSPECT_PROFILE || 'introspect' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq & curl
        run: sudo apt-get update -y && sudo apt-get install -y jq curl

      - name: Export meta + publish
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT_STATE="state/${TS}/meta"
          OUT_PUB="public/api/meta"
          mkdir -p "${OUT_STATE}" "${OUT_PUB}/latest" "${OUT_PUB}/snapshots/${TS}"

          hdr_pg=( -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" -H "Accept-Profile: postgres" -H "Content-Type: application/json" )
          hdr_int=( -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" -H "Accept-Profile: ${PROFILE}" -H "Content-Type: application/json" )

          # RLS policies
          if curl -fsS "${hdr_pg[@]}" "${URL}/rest/v1/pg_policy?select=oid,polname,polrelid,polcmd,polpermissive,polroles,polqual,polwithcheck" \
            -o "${OUT_STATE}/rls_policies.json"; then true; else echo "[]" > "${OUT_STATE}/rls_policies.json"; fi

          # dictionary (compose from rpc endpoints)
          curl -fsS "${hdr_int[@]}" "${URL}/rest/v1/rpc/tables"  -d '{}' -o "${OUT_STATE}/tables.json"   || echo "[]" > "${OUT_STATE}/tables.json"
          curl -fsS "${hdr_int[@]}" "${URL}/rest/v1/rpc/columns" -d '{}' -o "${OUT_STATE}/columns.json"  || echo "[]" > "${OUT_STATE}/columns.json"
          curl -fsS "${hdr_int[@]}" "${URL}/rest/v1/rpc/fks"     -d '{}' -o "${OUT_STATE}/fks.json"      || echo "[]" > "${OUT_STATE}/fks.json"
          curl -fsS "${hdr_int[@]}" "${URL}/rest/v1/rpc/pks"     -d '{}' -o "${OUT_STATE}/pks.json"      || echo "[]" > "${OUT_STATE}/pks.json"

          jq -n \
            --slurpfile t "${OUT_STATE}/tables.json" \
            --slurpfile c "${OUT_STATE}/columns.json" \
            --slurpfile f "${OUT_STATE}/fks.json" \
            --slurpfile p "${OUT_STATE}/pks.json" '
            { tables:($t[0]), columns:($c[0]), fks:($f[0]), pks:($p[0]) }' \
            > "${OUT_STATE}/dictionary.json"

          # publish snapshot + latest
          rsync -a "${OUT_STATE}/" "${OUT_PUB}/snapshots/${TS}/"
          rm -rf "${OUT_PUB}/latest" && mkdir -p "${OUT_PUB}/latest"
          rsync -a "${OUT_PUB}/snapshots/${TS}/" "${OUT_PUB}/latest/"

      - name: Commit & Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "meta-export-bot"
          git config user.email "meta-export-bot@users.noreply.github.com"
          git add public/api/meta state/*/meta
          git commit -m "meta-export: meta snapshot [skip ci]" || echo "Nothing to commit"
          git fetch origin main
          git rebase origin/main || true
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: public }

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
