name: Publish Database Mirror to Pages

on:
  workflow_run:
    workflows: ["Project Introspection"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare export directory
        run: |
          mkdir -p public/api/db
          cp -r db_inventory/* public/api/db/ || true
          cp -r state/* public/api/state/ || true
          cp -r sbom/* public/api/sbom/ || true
          cp -r snapshots/* public/api/snapshots/ || true
          echo "Database mirror generated at $(date -u)" > public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
